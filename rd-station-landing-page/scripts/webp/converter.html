<!doctype html><meta charset="utf-8"><title>convertendo…</title>
<body style="font:14px monospace;padding:16px"><pre id="out">convertendo…</pre>
<script>
/* Converte orig/<arquivo> em WebP redimensionado, baixando a qualidade até caber no limite.
   Lê lista.json ({"arquivo": [largura_max, limite_kb]}) e grava via POST no servidor.py.
   Mantém transparência (canal alfa). Nunca aumenta a imagem. */
(async () => {
  const lista = await (await fetch('lista.json', { cache: 'no-store' })).json();
  const resumo = {};
  for (const [arq, [maxW, kb]] of Object.entries(lista)) {
    const img = new Image(); img.src = 'orig/' + encodeURIComponent(arq); await img.decode();
    const w = Math.min(maxW, img.naturalWidth), h = Math.round(img.naturalHeight * w / img.naturalWidth);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
    let q = 0.86, url, bytes;
    for (;;) {
      url = c.toDataURL('image/webp', q); bytes = Math.round((url.length - 23) * 3 / 4);
      if (bytes <= kb * 1024 || q <= 0.5) break;
      q = Math.round((q - 0.04) * 100) / 100;
    }
    await fetch('/save?k=' + encodeURIComponent(arq), { method: 'POST', body: await (await fetch(url)).blob() });
    resumo[arq] = { largura: w, altura: h, qualidade: q, kb: Math.round(bytes / 1024) };
    document.getElementById('out').textContent = JSON.stringify(resumo, null, 1);
  }
  await fetch('/save?k=resumo.json', { method: 'POST', body: JSON.stringify(resumo, null, 1) });
  window.__resumo = resumo; document.title = 'pronto';
})().catch((e) => { document.title = 'erro'; document.getElementById('out').textContent = String(e); });
</script>
